<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper - Ναρκαλιευτής</title>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --board-bg: #bdbdbd;
            --cell-bg: #c6c6c6;
            --cell-shadow-light: #fff;
            --cell-shadow-dark: #7b7b7b;
            --revealed-bg: #d1d1d1;
            --progress-color: #4CAF50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 { margin-bottom: 10px; color: #333; text-align: center; }

        /* Badge/Γρανάζι ρυθμίσεων */
        #settings-badge {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .gear-icon {
            transition: transform 0.4s ease, stroke 0.3s ease;
            transform-origin: center;
        }

        #settings-badge:hover .gear-icon {
            transform: rotate(90deg) scale(1.1);
            stroke: #222;
        }

        .board-container {
            display: flex;
            flex-direction: row;
            gap: 25px;
            align-items: flex-start;
            justify-content: center;
            margin-top: 5px;
            width: 100%;
            max-width: 1000px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .scoreboard {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-width: 220px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }

        .scoreboard h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #333;
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .score-stat {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            color: #555;
            font-weight: bold;
        }

        .score-val {
            color: #2196F3;
            font-size: 16px;
        }

        .score-val.win-val { color: #4CAF50; }
        .score-val.loss-val { color: #e74c3c; }

        @media (max-width: 768px) {
            .board-container {
                flex-direction: column;
                align-items: center;
            }
            .scoreboard {
                width: 100%;
                max-width: 450px;
                margin-bottom: 15px;
            }
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
            background: #fff;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Ομαδοποίηση Ελέγχων για σαφήνεια */
        .control-group {
            display: flex;
            flex-direction: column;
            background: #f9f9f9;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .control-group.help-tool {
            background: #e3f2fd;
            border-color: #90caf9;
        }

        .group-label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group.help-tool .group-label {
            color: #1565c0;
        }

        .group-row {
            display: flex;
            gap: 10px;
        }

        select, button {
            padding: 8px 12px;
            font-size: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            cursor: pointer;
            outline: none;
        }

        select:focus { border-color: #4CAF50; }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover { background-color: #45a049; }
        
        .btn-random { background-color: #2196F3; }
        .btn-random:hover { background-color: #1976D2; }

        .game-stats {
            width: 100%;
            max-width: 450px;
            margin-bottom: 15px;
            background: #fff;
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }

        .progress-container {
            width: 100%;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            height: 20px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--progress-color);
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .progress-text {
            font-size: 14px;
            color: #333;
            font-weight: bold;
            text-align: center;
            margin-bottom: 4px;
        }

        /* Στυλ για το Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-title { margin-top: 0; color: #333; font-size: 22px; }
        .architect { font-weight: bold; font-size: 18px; color: #2c3e50; margin: 15px 0 5px; }
        .version { font-size: 14px; color: #7f8c8d; margin-bottom: 25px; font-weight: 500; }
        
        .lang-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .lang-flag {
            font-size: 35px;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            filter: grayscale(40%);
        }

        .lang-flag:hover { transform: scale(1.15); filter: grayscale(0%); }
        .lang-flag.active { transform: scale(1.15); filter: grayscale(0%); drop-shadow: 0 4px 4px rgba(0,0,0,0.2); }

        .btn-close {
            background-color: #e74c3c;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
        }
        .btn-close:hover { background-color: #c0392b; }

        /* Στυλ Πίνακα Παιχνιδιού */
        #game-board {
            display: grid;
            background-color: var(--board-bg);
            padding: 10px;
            border-top: 3px solid var(--cell-shadow-light);
            border-left: 3px solid var(--cell-shadow-light);
            border-right: 3px solid var(--cell-shadow-dark);
            border-bottom: 3px solid var(--cell-shadow-dark);
            gap: 0; 
        }

        .cell {
            width: 30px;
            height: 30px;
            background-color: var(--cell-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            font-size: 20px;
            box-sizing: border-box;
            border-top: 3px solid var(--cell-shadow-light);
            border-left: 3px solid var(--cell-shadow-light);
            border-right: 3px solid var(--cell-shadow-dark);
            border-bottom: 3px solid var(--cell-shadow-dark);
        }

        .cell.revealed { background-color: var(--revealed-bg); border: 1px solid #7b7b7b; width: 30px; height: 30px; }
        .cell.mine { background-color: #e74c3c; }
        .cell.flag { color: red; }
        .cell.question { color: #2196F3; }

        .c1 { color: blue; }
        .c2 { color: green; }
        .c3 { color: red; }
        .c4 { color: darkblue; }
        .c5 { color: darkred; }
        .c6 { color: teal; }
        .c7 { color: black; }
        .c8 { color: gray; }
    </style>
</head>
<body>

    <!-- Κουμπί Ρυθμίσεων -->
    <div id="settings-badge" onclick="openSettings()" title="Settings">
        <svg class="gear-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </div>

    <h1 id="main-title">💣 Ναρκαλιευτής</h1>

    <div class="controls">
        <!-- Group 1: Βασικός Έλεγχος Παιχνιδιού -->
        <div class="control-group">
            <div class="group-label" id="lbl-difficulty">Επίπεδο Δυσκολίας</div>
            <div class="group-row">
                <select id="difficulty">
                    <option id="opt-easy" value="easy">Εύκολο (9x9)</option>
                    <option id="opt-medium" value="medium" selected>Μεσαίο (16x16)</option>
                    <option id="opt-hard" value="hard">Δύσκολο (16x30)</option>
                </select>
                <button id="btn-restart" onclick="startGame()">Επανεκκίνηση 😊</button>
            </div>
        </div>
        
        <!-- Group 2: Βοηθητικό Εργαλείο -->
        <div class="control-group help-tool">
            <div class="group-label" id="lbl-random-tool">Βοηθητικό Εργαλείο</div>
            <div class="group-row">
                <select id="randomCount">
                    <option id="opt-r1" value="1">1 Κελί</option>
                    <option id="opt-r2" value="2">2 Κελιά</option>
                    <option id="opt-r3" value="3">3 Κελιά</option>
                    <option id="opt-r4" value="4">4 Κελιά</option>
                    <option id="opt-r5" value="5">5 Κελιά</option>
                </select>
                <button id="btn-random" class="btn-random" onclick="revealRandomCells()">Τυχαίο Άνοιγμα 🎲</button>
            </div>
        </div>
    </div>

    <div class="game-stats">
        <div class="info-panel">
            <div><span id="lbl-mines">🚩 Νάρκες:</span> <span id="mines-count">10</span></div>
            <div><span id="lbl-time">⏱️ Χρόνος:</span> <span id="timer">0</span></div>
        </div>
        
        <div class="progress-section">
            <div class="progress-text"><span id="lbl-progress">Πρόοδος:</span> <span id="progress-text-val">0 / 0</span></div>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </div>
    </div>

    <div class="board-container">
        <!-- Scoreboard -->
        <aside class="scoreboard">
            <h2 id="lbl-scoreboard">📊 Στατιστικά</h2>
            <div class="score-stat"><span id="lbl-played">Παιχνίδια:</span> <span id="stat-played" class="score-val">0</span></div>
            <div class="score-stat"><span id="lbl-won">Νίκες:</span> <span id="stat-won" class="score-val win-val">0</span></div>
            <div class="score-stat"><span id="lbl-win-rate">Ποσοστό Νικών:</span> <span id="stat-win-rate" class="score-val win-val">0%</span></div>
            <div class="score-stat"><span id="lbl-loss-rate">Ποσοστό Ηττών:</span> <span id="stat-loss-rate" class="score-val loss-val">0%</span></div>
        </aside>

        <div id="game-board" oncontextmenu="return false;"></div>
    </div>

    <!-- Modal Ρυθμίσεων -->
    <div id="settings-modal" class="modal-overlay" onclick="closeSettingsOutside(event)">
        <div class="modal-content">
            <h2 class="modal-title" id="modal-title">Ρυθμίσεις</h2>
            
            <div class="architect">Program Architect:<br>George Petrakis</div>
            <div class="version">
                Minesweeper
                <!-- --- ΕΚΔΟΣΗ (VERSION) START --- -->
                v4
                <!-- --- ΕΚΔΟΣΗ (VERSION) END --- -->
            </div>

            <div class="lang-container">
                <span class="lang-flag" id="flag-el" onclick="setLanguage('el')">🇬🇷</span>
                <span class="lang-flag" id="flag-en" onclick="setLanguage('en')">🇬🇧</span>
            </div>

            <button id="btn-close" class="btn-close" onclick="closeSettings()">Κλείσιμο</button>
        </div>
    </div>

    <script>
        // --- Σύστημα Μετάφρασης ---
        const translations = {
            el: {
                title: "💣 Ναρκαλιευτής",
                lblDifficulty: "Επίπεδο Δυσκολίας",
                optEasy: "Εύκολο (9x9)",
                optMedium: "Μεσαίο (16x16)",
                optHard: "Δύσκολο (16x30)",
                btnRestart: "Επανεκκίνηση 😊",
                lblRandomTool: "Βοηθητικό Εργαλείο",
                optR1: "1 Κελί", optR2: "2 Κελιά", optR3: "3 Κελιά", optR4: "4 Κελιά", optR5: "5 Κελιά",
                btnRandom: "Τυχαίο Άνοιγμα 🎲",
                lblMines: "🚩 Νάρκες:",
                lblTime: "⏱️ Χρόνος:",
                lblProgress: "Πρόοδος:",
                modalTitle: "Ρυθμίσεις / Πληροφορίες",
                btnClose: "Κλείσιμο",
                winMsg: "Συγχαρητήρια! Κέρδισες σε {time} δευτερόλεπτα! 🎉",
                loseMsg: "Έχασες! Πάτησες νάρκη 💥",
                lblScoreboard: "📊 Στατιστικά",
                lblPlayed: "Παιχνίδια:",
                lblWon: "Νίκες:",
                lblWinRate: "Ποσοστό Νικών:",
                lblLossRate: "Ποσοστό Ηττών:"
            },
            en: {
                title: "💣 Minesweeper",
                lblDifficulty: "Difficulty Level",
                optEasy: "Easy (9x9)",
                optMedium: "Medium (16x16)",
                optHard: "Hard (16x30)",
                btnRestart: "Restart 😊",
                lblRandomTool: "Help Tool",
                optR1: "1 Cell", optR2: "2 Cells", optR3: "3 Cells", optR4: "4 Cells", optR5: "5 Cells",
                btnRandom: "Random Reveal 🎲",
                lblMines: "🚩 Mines:",
                lblTime: "⏱️ Time:",
                lblProgress: "Progress:",
                modalTitle: "Settings / Info",
                btnClose: "Close",
                winMsg: "Congratulations! You won in {time} seconds! 🎉",
                loseMsg: "You lost! You hit a mine 💥",
                lblScoreboard: "📊 Scoreboard",
                lblPlayed: "Games Played:",
                lblWon: "Wins:",
                lblWinRate: "Win Rate:",
                lblLossRate: "Loss Rate:"
            }
        };

        let currentLang = localStorage.getItem('minesweeper-lang') || 'el';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('minesweeper-lang', lang);
            
            const t = translations[lang];
            document.title = t.title.replace('💣 ', '');
            document.getElementById('main-title').innerText = t.title;
            document.getElementById('lbl-difficulty').innerText = t.lblDifficulty;
            document.getElementById('opt-easy').innerText = t.optEasy;
            document.getElementById('opt-medium').innerText = t.optMedium;
            document.getElementById('opt-hard').innerText = t.optHard;
            document.getElementById('btn-restart').innerText = t.btnRestart;
            
            document.getElementById('lbl-random-tool').innerText = t.lblRandomTool;
            document.getElementById('opt-r1').innerText = t.optR1;
            document.getElementById('opt-r2').innerText = t.optR2;
            document.getElementById('opt-r3').innerText = t.optR3;
            document.getElementById('opt-r4').innerText = t.optR4;
            document.getElementById('opt-r5').innerText = t.optR5;
            document.getElementById('btn-random').innerText = t.btnRandom;

            document.getElementById('lbl-mines').innerText = t.lblMines;
            document.getElementById('lbl-time').innerText = t.lblTime;
            document.getElementById('lbl-progress').innerText = t.lblProgress;

            document.getElementById('modal-title').innerText = t.modalTitle;
            document.getElementById('btn-close').innerText = t.btnClose;

            document.getElementById('lbl-scoreboard').innerText = t.lblScoreboard;
            document.getElementById('lbl-played').innerText = t.lblPlayed;
            document.getElementById('lbl-won').innerText = t.lblWon;
            document.getElementById('lbl-win-rate').innerText = t.lblWinRate;
            document.getElementById('lbl-loss-rate').innerText = t.lblLossRate;

            // Ενημέρωση active σημαίας
            document.getElementById('flag-el').classList.remove('active');
            document.getElementById('flag-en').classList.remove('active');
            document.getElementById(`flag-${lang}`).classList.add('active');
        }

        // --- Διαχείριση Modal ---
        const modal = document.getElementById('settings-modal');
        function openSettings() { modal.style.display = 'flex'; }
        function closeSettings() { modal.style.display = 'none'; }
        function closeSettingsOutside(e) { if(e.target === modal) closeSettings(); }

        // --- Βασικός Κώδικας Ναρκαλιευτή ---
        const boardElement = document.getElementById('game-board');
        const minesCountElement = document.getElementById('mines-count');
        const timerElement = document.getElementById('timer');
        const difficultySelect = document.getElementById('difficulty');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text-val');

        let sessionGamesPlayed = 0;
        let sessionGamesWon = 0;

        function updateScoreboard() {
            document.getElementById('stat-played').innerText = sessionGamesPlayed;
            document.getElementById('stat-won').innerText = sessionGamesWon;
            const winRate = sessionGamesPlayed > 0 ? Math.round((sessionGamesWon / sessionGamesPlayed) * 100) : 0;
            const lossRate = sessionGamesPlayed > 0 ? 100 - winRate : 0;
            document.getElementById('stat-win-rate').innerText = `${winRate}%`;
            document.getElementById('stat-loss-rate').innerText = `${lossRate}%`;
        }

        let grid = [];
        let config = {};
        let timer;
        let timeElapsed = 0;
        let isGameOver = false;
        let firstClick = true;
        let flagsPlaced = 0;
        let totalSafeCells = 0;

        const difficulties = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 }
        };

        difficultySelect.addEventListener('change', () => {
            localStorage.setItem('minesweeper-level', difficultySelect.value);
            startGame();
        });

        function startGame() {
            clearInterval(timer);
            timeElapsed = 0;
            timerElement.innerText = 0;
            isGameOver = false;
            firstClick = true;
            flagsPlaced = 0;
            grid = [];
            boardElement.innerHTML = '';

            progressBar.style.width = '0%';
            progressBar.style.backgroundColor = ''; 
            
            const level = difficultySelect.value;
            config = difficulties[level] || difficulties.medium;

            minesCountElement.innerText = config.mines;
            totalSafeCells = (config.rows * config.cols) - config.mines;
            progressText.innerText = `0 / ${totalSafeCells}`;

            boardElement.style.gridTemplateColumns = `repeat(${config.cols}, 30px)`;

            for (let r = 0; r < config.rows; r++) {
                grid[r] = [];
                for (let c = 0; c < config.cols; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    
                    cell.addEventListener('click', () => handleClick(r, c));
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault(); 
                        handleRightClick(r, c);
                    });

                    boardElement.appendChild(cell);
                    grid[r][c] = { element: cell, isMine: false, revealed: false, flagged: 0, neighborMines: 0 };
                }
            }
        }

        function placeMines(excludeRow, excludeCol) {
            let minesPlaced = 0;
            while (minesPlaced < config.mines) {
                let r = Math.floor(Math.random() * config.rows);
                let c = Math.floor(Math.random() * config.cols);
                if (!grid[r][c].isMine && (r !== excludeRow || c !== excludeCol)) {
                    grid[r][c].isMine = true;
                    minesPlaced++;
                }
            }
            calculateNeighbors();
        }

        function calculateNeighbors() {
            for (let r = 0; r < config.rows; r++) {
                for (let c = 0; c < config.cols; c++) {
                    if (grid[r][c].isMine) continue;
                    let count = 0;
                    for (let i = -1; i <= 1; i++) {
                        for (let j = -1; j <= 1; j++) {
                            const nr = r + i, nc = c + j;
                            if (nr >= 0 && nr < config.rows && nc >= 0 && nc < config.cols && grid[nr][nc].isMine) count++;
                        }
                    }
                    grid[r][c].neighborMines = count;
                }
            }
        }

        function handleClick(r, c) {
            if (isGameOver || grid[r][c].flagged === 1 || grid[r][c].revealed) return;

            if (firstClick) {
                firstClick = false;
                placeMines(r, c);
                startTimer();
            }

            if (grid[r][c].isMine) gameOver(false);
            else { revealCell(r, c); updateProgress(); }
        }

        function handleRightClick(r, c) {
            if (isGameOver || grid[r][c].revealed) return;
            const cellData = grid[r][c];
            const cellEl = cellData.element;

            if (cellData.flagged === 0) {
                cellData.flagged = 1; cellEl.innerText = '🚩'; cellEl.classList.add('flag'); flagsPlaced++;
            } else if (cellData.flagged === 1) {
                cellData.flagged = 2; cellEl.innerText = '❓'; cellEl.classList.remove('flag'); cellEl.classList.add('question'); flagsPlaced--;
            } else {
                cellData.flagged = 0; cellEl.innerText = ''; cellEl.classList.remove('question');
            }
            minesCountElement.innerText = config.mines - flagsPlaced;
        }

        function revealCell(r, c) {
            const cellData = grid[r][c];
            if (cellData.revealed || cellData.flagged === 1) return;

            cellData.revealed = true;
            cellData.element.classList.add('revealed');
            
            if (cellData.flagged === 2) { 
                cellData.element.innerText = ''; cellData.element.classList.remove('question'); cellData.flagged = 0;
            }

            if (cellData.neighborMines > 0) {
                cellData.element.innerText = cellData.neighborMines;
                cellData.element.classList.add(`c${cellData.neighborMines}`);
            } else {
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        const nr = r + i, nc = c + j;
                        if (nr >= 0 && nr < config.rows && nc >= 0 && nc < config.cols) revealCell(nr, nc);
                    }
                }
            }
        }

        function updateProgress() {
            let revealedCount = 0;
            for (let r = 0; r < config.rows; r++) {
                for (let c = 0; c < config.cols; c++) {
                    if (grid[r][c].revealed) revealedCount++;
                }
            }

            const percentage = Math.floor((revealedCount / totalSafeCells) * 100);
            progressBar.style.width = `${percentage}%`;
            progressText.innerText = `${revealedCount} / ${totalSafeCells} (${percentage}%)`;

            if (revealedCount === totalSafeCells) gameOver(true);
        }

        function startTimer() {
            timer = setInterval(() => { timeElapsed++; timerElement.innerText = timeElapsed; }, 1000);
        }

        function gameOver(win) {
            isGameOver = true;
            clearInterval(timer);
            
            sessionGamesPlayed++;
            if (win) sessionGamesWon++;
            updateScoreboard();

            const msg = win 
                ? translations[currentLang].winMsg.replace('{time}', timeElapsed) 
                : translations[currentLang].loseMsg;

            if (win) {
                progressBar.style.width = '100%';
                progressBar.style.backgroundColor = '#2196F3';
                setTimeout(() => alert(msg), 20);
            } else {
                for (let r = 0; r < config.rows; r++) {
                    for (let c = 0; c < config.cols; c++) {
                        const current = grid[r][c];
                        if (current.isMine) {
                            current.element.classList.add('revealed', 'mine');
                            current.element.innerText = '💣';
                        }
                        if (!current.isMine && current.flagged === 1) current.element.innerText = '❌';
                    }
                }
                progressBar.style.backgroundColor = '#e74c3c';
                setTimeout(() => alert(msg), 20);
            }
        }

        function revealRandomCells() {
            if (isGameOver) {
                startGame();
            }
            const numToReveal = parseInt(document.getElementById('randomCount').value);
            
            for (let i = 0; i < numToReveal; i++) {
                if (isGameOver) break;
                const clickableCells = [];
                for (let r = 0; r < config.rows; r++) {
                    for (let c = 0; c < config.cols; c++) {
                        if (!grid[r][c].revealed && grid[r][c].flagged !== 1) clickableCells.push({r, c});
                    }
                }
                if (clickableCells.length === 0) break;
                const { r, c } = clickableCells[Math.floor(Math.random() * clickableCells.length)];
                handleClick(r, c);
            }
            if (!isGameOver) updateProgress();
        }

        // Αρχικοποίηση
        const savedLevel = localStorage.getItem('minesweeper-level');
        if (savedLevel && difficulties[savedLevel]) difficultySelect.value = savedLevel;
        setLanguage(currentLang);
        startGame();

    </script>
</body>
</html>
